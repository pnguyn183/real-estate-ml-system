services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    platform: linux/amd64
    container_name: real_estate_llm_lean_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - llm_lean_zookeeper_data:/var/lib/zookeeper/data
      - llm_lean_zookeeper_log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    memswap_limit: 512M
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    platform: linux/amd64
    container_name: real_estate_llm_lean_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms384m -Xmx512m
    volumes:
      - llm_lean_kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M
    memswap_limit: 1280M
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    platform: linux/amd64
    container_name: real_estate_llm_lean_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in \
          real_estate_raw real_estate_features \
          real_estate_stress_raw real_estate_stress_features \
          real_estate_ai_input real_estate_ai_results real_estate_ai_dlq; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$${topic}" \
            --partitions 3 --replication-factor 1 \
            --config min.insync.replicas=1
        done
        kafka-topics --bootstrap-server kafka:29092 \
          --describe --topic real_estate_stress_raw
    restart: "no"

  mongodb:
    image: mongo:7
    platform: linux/amd64
    container_name: real_estate_llm_lean_mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:37017:27017"
    volumes:
      - llm_lean_mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    memswap_limit: 1536M
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  processor:
    image: real-estate-llm-lean-processor:local
    build:
      # Commands use the repository root as --project-directory.
      context: .
      dockerfile: processing/Dockerfile
    platform: linux/amd64
    container_name: real_estate_llm_lean_processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: real_estate_raw
      KAFKA_CLEAN_TOPIC: real_estate_features
      KAFKA_GROUP_ID: real_estate_training_pipeline_lean
      KAFKA_STRESS_TOPIC: real_estate_stress_raw
      KAFKA_STRESS_CLEAN_TOPIC: real_estate_stress_features
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: real_estate_db
      MONGO_STRESS_DB: real_estate_stress_db
      AI_FALLBACK_ENABLED: "false"
      AI_STRESS_ENABLED: "false"
      KAFKA_AI_TOPIC: real_estate_ai_input
      KAFKA_AI_RESULT_TOPIC: real_estate_ai_results
      KAFKA_AI_DLQ_TOPIC: real_estate_ai_dlq
      PROMETHEUS_METRICS_PORT: 8003
    ports:
      - "127.0.0.1:18003:8003"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    memswap_limit: 768M
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  llm_lean_zookeeper_data:
  llm_lean_zookeeper_log:
  llm_lean_kafka_data:
  llm_lean_mongo_data:
