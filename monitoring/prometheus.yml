global:
  scrape_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'scraper'
    static_configs:
      - targets: ['scraper:8008']
  - job_name: 'processor'
    static_configs:
      - targets: ['processor:8003']
  - job_name: 'processor-2'
    static_configs:
      - targets: ['processor-2:8004']
  - job_name: 'processor-3'
    static_configs:
      - targets: ['processor-3:8005']
  - job_name: 'trainer'
    static_configs:
      - targets: ['trainer:8001']
  - job_name: 'ai-agent'
    dns_sd_configs:
      - names: ['ai-agent']
        type: A
        port: 8006
        refresh_interval: 15s
  - job_name: 'stress-agent'
    static_configs:
      - targets: ['stress-agent:8007']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
